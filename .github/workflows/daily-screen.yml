name: daily-screen
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install tradingview-screener yfinance pandas numpy
      - name: Apply dashboard upgrades
        run: |
          python indy_upgrade.py screener.py
          python terminal_upgrade.py screener.py
          rm -f screener.py.bak
      - name: Run screener
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python screener.py --no-open
      - name: Commit history archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Update history archive ($(date -u +%F))" || echo "no history changes"
          git push
      - name: Publish to Pages
        run: mkdir -p _site && cp dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
